name: Release

# A `v*` tag push builds every target and creates a DRAFT GitHub release; a maintainer publishes it by hand.
# A manual run is a dry run by default: it builds, packages, smoke-tests and uploads the archives as workflow
# artefacts without creating a release. CI's `release_dry_run` input calls this workflow with dry_run forced on, which
# also works before this file reaches the default branch. See "Release procedure" in docs/development.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artefacts only; do not create a draft release
        type: boolean
        default: true
      tag:
        description: Existing tag to attach a draft release to (only when dry_run is off)
        type: string
        default: ""
      macos:
        description: Include aarch64-apple-darwin (its runner minutes cost 10x Linux on a private repo)
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "2"
  # The release profile, stated here so a local profile edit cannot silently change shipped binaries.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG: ${{ inputs.tag }}
          MACOS: ${{ inputs.macos }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          if [ "$EVENT" = push ]; then
            tag=$REF_NAME
            publish=true
          elif [ "$DRY_RUN" = true ]; then
            tag=""
            publish=false
          else
            tag=$INPUT_TAG
            publish=true
            test -n "$tag" || { echo "::error::A non-dry run needs an existing tag"; exit 1; }
          fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match the workspace version $version"
            exit 1
          fi
          linux='{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04"}'
          macos='{"target":"aarch64-apple-darwin","os":"macos-15"}'
          if [ "$EVENT" = push ] || [ "$MACOS" != false ]; then
            matrix="[$linux,$macos]"
          else
            matrix="[$linux]"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "matrix={\"include\":$matrix}"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=${tag:-<none>} publish=$publish matrix=$matrix"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Require the decompiler's C/C++ toolchain and zlib
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash tools/ci/apt-install.sh build-essential zlib1g-dev
      - name: Build release binaries
        timeout-minutes: 80
        run: |
          time cargo build --locked --release --target "$TARGET" \
            -p rampage-cli -p rampage-worker -p rampage-ui
      - name: Package
        run: bash tools/ci/package-release.sh "$TARGET" "$VERSION" "target/$TARGET/release" dist
      - name: Unpack and smoke-test the archive
        run: bash tools/ci/check-release-archive.sh "dist/rampage-$VERSION-$TARGET.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rampage-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create the draft release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ls -l dist
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$TAG" --draft --verify-tag --title "rampage $TAG" --generate-notes dist/*
