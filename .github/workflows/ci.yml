name: CI

# Triggers. Push to main and pull requests are declared now but only run once the repository is public: every job
# checks `github.event.repository.private == false` for those events, because macOS minutes on a private repository
# cost ten times Linux minutes. Version tags and manual runs work today. See "Continuous integration" in
# docs/development.md.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the macOS job (its runner minutes cost 10x Linux on a private repo)
        type: boolean
        default: false
      full:
        description: Run every test (nextest `full` profile) instead of the default profile
        type: boolean
        default: false
      live:
        description: Also run the live QEMU debugger acceptance on Linux
        type: boolean
        default: false
      release_dry_run:
        description: Also build, package and smoke-test release archives (never creates a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "2"
  RUST_TEST_THREADS: "1"
  RUST_BACKTRACE: "1"
  TZ: UTC
  NEXTEST_PROFILE: ${{ inputs.full && 'full' || 'default' }}
  # sccache caches Rust dependency crates and, because cc-rs adopts a sccache RUSTC_WRAPPER as its C/C++ wrapper,
  # every object of the embedded Ghidra decompiler. Entries are content-addressed in the GitHub Actions cache.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  hygiene:
    name: Formatting, script regressions and secrets
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        timeout-minutes: 3
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path plugins/triage-report/Cargo.toml --check
          cargo fmt --manifest-path plugins/runtime-probe/Cargo.toml --check
      - name: Corpus runner and acceptance-gate regressions
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest tools.test_decompiler_corpus tools.test_entry_measurements -v
      - name: Agent benchmark runner stream parsing
        timeout-minutes: 2
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -m unittest discover -s tools/agent-bench -p 'test_*.py' -v
      - name: Installer publication regressions with owned fake roots
        timeout-minutes: 2
        run: bash tools/test_install.sh
      - name: Scan with checksum-pinned official Gitleaks release
        timeout-minutes: 10
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/rampage-gitleaks.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$scratch/$archive"
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          printf '%s  %s\n' "$checksum" "$scratch/$archive" | sha256sum --check --strict
          tar -xzf "$scratch/$archive" -C "$scratch" gitleaks
          time bash tools/ci/test-scan-secrets.sh "$scratch/gitleaks"
          time bash tools/ci/scan-secrets.sh "$scratch/gitleaks"

  clippy:
    name: Linux x86-64 warnings-denied Clippy
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Require the decompiler's C/C++ toolchain and zlib
        timeout-minutes: 5
        run: bash tools/ci/apt-install.sh build-essential zlib1g-dev
      - name: Warnings-denied workspace Clippy
        timeout-minutes: 35
        run: time cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  linux:
    name: Linux x86-64 workspace tests and gates
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Require the decompiler's C/C++ toolchain, zlib and fixture tools
        timeout-minutes: 5
        env:
          LIVE: ${{ inputs.live }}
        run: |
          packages=(build-essential clang zlib1g-dev binutils)
          if [ "$LIVE" = true ]; then packages+=(qemu-system-arm); fi
          bash tools/ci/apt-install.sh "${packages[@]}"
          rustc --version --verbose
          cc --version
          clang --version
          objcopy --version
      - name: Install checksum-pinned cargo-nextest
        timeout-minutes: 3
        run: bash tools/ci/install-nextest.sh
      - name: Workspace tests (nextest)
        timeout-minutes: 40
        run: |
          time cargo nextest run --locked --workspace --profile "$NEXTEST_PROFILE"
          # The workspace test build also builds the CLI and worker binaries, with the same features.
          test -x "$PWD/target/debug/rampage"
          test -x "$PWD/target/debug/rampage-worker"
      - name: Owned x86-64 ELF layout constants and field-use oracle
        timeout-minutes: 5
        run: time bash tools/ci/layout-oracle.sh
      - name: Owned DWARF and C++ record layout acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          DEBUG_LAYOUT_CPP=1 OBJCOPY=objcopy bash tools/ci/debug-layout-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored all -E '(package(rampage-loaders)) & binary(integration) & test(/(debug_layouts)::/)'
          OBJCOPY=objcopy bash tools/ci/debug-cpp-layout-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored all -E '(package(rampage-loaders)) & binary(integration) & test(/(debug_cpp_layouts)::/)'
      - name: Owned import-free components and hostile resource probes
        timeout-minutes: 10
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash tools/ci/plugin-triage-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored only -E '(package(rampage-plugin)) & binary(integration) & test(/(component|resource_controls|cancellation)::/)'
      - name: Live QEMU debugger acceptance
        if: inputs.live
        timeout-minutes: 10
        env:
          RAMPAGE_QEMU_LIVE: "1"
        run: cargo nextest run --locked -p rampage-api --run-ignored only -E 'test(/^debug_qemu::/)'
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  macos:
    name: macOS ARM64 workspace, UI and accuracy
    needs: hygiene
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.macos) || startsWith(github.ref, 'refs/tags/') ||
      (github.event_name != 'workflow_dispatch' && github.event.repository.private == false)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Require native ARM64 compiler and macOS SDK
        timeout-minutes: 2
        run: |
          test "$(uname -m)" = arm64
          rustc --version --verbose
          cargo --version
          clang --version
          clang++ --version
          xcrun --sdk macosx --show-sdk-path
      - name: Installer publication regressions with BSD tools
        timeout-minutes: 2
        run: bash tools/test_install.sh
      - name: Install checksum-pinned cargo-nextest
        timeout-minutes: 3
        run: bash tools/ci/install-nextest.sh
      - name: Warnings-denied workspace Clippy
        timeout-minutes: 30
        run: time cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests including offscreen UI snapshots and the accuracy gate (nextest)
        timeout-minutes: 30
        run: |
          time cargo nextest run --locked --workspace --profile "$NEXTEST_PROFILE"
          # The workspace test build also builds the CLI and worker binaries, with the same features.
          test -x "$PWD/target/debug/rampage"
          test -x "$PWD/target/debug/rampage-worker"
      - name: Controlled supervised decompiler assertions and recovery gates
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/decompiler_corpus.py "$PWD/target/debug/rampage" \
            --manifest tests/data/decompiler-corpus.json --isolated --timeout 30
      - name: Owned PE declared module references
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/module-linkage-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored all -E '(package(rampage-api) | package(rampage-ui)) & binary(integration) & test(/(module_references)::/)'
      - name: Owned component workflow and resource boundaries
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo test --locked --manifest-path plugins/triage-report/Cargo.toml --target-dir target
          bash tools/ci/plugin-triage-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored only -E '(package(rampage-plugin)) & binary(integration) & test(/(component|resource_controls|cancellation)::/)'
          bash tools/ci/plugin-triage-oracle.sh --check \
            bash tools/ci/module-linkage-oracle.sh --check \
              cargo nextest run --locked --workspace --run-ignored all -E '(package(rampage-api) | package(rampage-cli)) & binary(integration) & test(/(plugin_triage)::/)'
      - name: Owned DWARF reviewed import surfaces and worker acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DEBUG_LAYOUT_CPP: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/debug-layout-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored all -E '(package(rampage-loaders) | package(rampage-api) | package(rampage-worker) | package(rampage-cli) | package(rampage-mcp) | package(rampage-ui)) & binary(integration) & test(/(debug_layouts|debug_layout_import|debug_layout_acceptance|debug_layout_review|debug_layout_tools|debug_layout)::/)'
      - name: Owned bounded C++ record and this-method acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/debug-cpp-layout-oracle.sh --check \
            cargo nextest run --locked --workspace --run-ignored all -E '(package(rampage-loaders) | package(rampage-api) | package(rampage-worker)) & binary(integration) & test(/(debug_cpp_layouts|debug_cpp_layout_acceptance)::/)'
      - name: Owned opaque-vptr and exact source-slot acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          # The oracle pins Apple clang 21+, which emits the `_vtable$` DWARF artifacts it checks. GitHub's macOS
          # images ship an older Apple clang, so the lane runs only where that compiler is present (locally on a
          # current macOS release) and is skipped, visibly, elsewhere.
          major=$(clang --version | sed -n 's/^Apple clang version \([0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 21 ]; then
            echo "::notice::Skipping the opaque-vptr acceptance: it needs Apple clang 21+, this runner has $(clang --version | head -1)"
            exit 0
          fi
          bash tools/ci/debug-cpp-virtual-acceptance.sh
      - name: Opt-in native compiled fixture and isolated CLI acceptance
        timeout-minutes: 5
        run: |
          time cargo nextest run --locked --workspace --run-ignored only -E '(package(rampage-api)) & binary(integration) & test(/(compiled_arm64)::/)'
          export RAMPAGE_TEST_CLI="$PWD/target/debug/rampage"
          test -x "$RAMPAGE_TEST_CLI"
          time cargo nextest run --locked --workspace --run-ignored only -E '(package(rampage-worker)) & binary(integration) & test(/(cli)::/)'
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  release-dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run
    uses: ./.github/workflows/release.yml
    # A called workflow may not request more than its caller grants; the draft-release job (which needs write) is
    # skipped because dry_run is forced on.
    permissions:
      contents: write
    with:
      dry_run: true
      macos: ${{ inputs.macos }}

# Step/job timeouts bound CI execution, not individual analysis time or memory.
# Both workspace jobs run nextest's default profile (the 23 heaviest tests are filtered out; see
# .config/nextest.toml); a manual run with `full` runs every test. The Linux job also runs the owned x86-64 ELF,
# DWARF, C++ layout and component oracles that the former linux-core and linux-components jobs ran.
# Ignored million-point context and Chrome performance tests are not CI coverage.
# Metal-backed UI snapshots must pass on macOS; they are compiled out on other hosts, with no headless Linux UI claims.
