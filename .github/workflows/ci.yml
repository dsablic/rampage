name: CI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "2"
  RUST_TEST_THREADS: "1"
  RUST_BACKTRACE: "1"
  TZ: UTC

jobs:
  hygiene:
    name: Formatting and secrets (HEAD + history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        timeout-minutes: 3
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path plugins/triage-report/Cargo.toml --check
          cargo fmt --manifest-path plugins/runtime-probe/Cargo.toml --check
      - name: Corpus runner and acceptance-gate regressions
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest tools.test_decompiler_corpus tools.test_entry_measurements -v
      - name: Installer publication regressions with owned fake roots
        timeout-minutes: 2
        run: bash tools/test_install.sh
      - name: Scan with checksum-pinned official Gitleaks release
        timeout-minutes: 10
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/rampage-gitleaks.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$scratch/$archive"
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          printf '%s  %s\n' "$checksum" "$scratch/$archive" | sha256sum --check --strict
          tar -xzf "$scratch/$archive" -C "$scratch" gitleaks
          time bash tools/ci/test-scan-secrets.sh "$scratch/gitleaks"
          time bash tools/ci/scan-secrets.sh "$scratch/gitleaks"

  macos:
    name: macOS ARM64 workspace, UI and accuracy
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Require native ARM64 compiler and macOS SDK
        timeout-minutes: 2
        run: |
          test "$(uname -m)" = arm64
          rustc --version --verbose
          cargo --version
          clang --version
          clang++ --version
          xcrun --sdk macosx --show-sdk-path
      - name: Installer publication regressions with BSD tools
        timeout-minutes: 2
        run: bash tools/test_install.sh
      - name: Require LLVM fixture tools
        timeout-minutes: 3
        run: rustup component add llvm-tools-preview
      - name: Require the owned component guest target
        timeout-minutes: 3
        run: rustup target add wasm32-unknown-unknown
      - name: Warnings-denied workspace Clippy
        timeout-minutes: 30
        run: time cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build CLI and its required supervised sibling worker
        timeout-minutes: 15
        run: |
          time cargo build --locked -p rampage-cli -p rampage-worker
          test -x "$PWD/target/debug/rampage"
          test -x "$PWD/target/debug/rampage-worker"
      - name: Existing 13-slice accuracy gate and evaluation CLI regressions
        timeout-minutes: 10
        run: time cargo test --locked -p rampage-eval
      - name: Controlled supervised decompiler assertions and recovery gates
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/decompiler_corpus.py "$PWD/target/debug/rampage" \
            --manifest tests/data/decompiler-corpus.json --isolated --timeout 30
      - name: Workspace tests including offscreen UI snapshots
        timeout-minutes: 20
        run: time cargo test --locked --workspace --exclude rampage-eval
      - name: Owned PE declared module references
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/module-linkage-oracle.sh --check \
            cargo test --locked -p rampage-api -p rampage-ui --test integration -- module_references:: --include-ignored
      - name: Owned component workflow and resource boundaries
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo test --locked --manifest-path plugins/triage-report/Cargo.toml --target-dir target
          bash tools/ci/plugin-triage-oracle.sh --check \
            cargo test --locked -p rampage-plugin \
              --test integration -- component:: resource_controls:: cancellation:: --ignored
          bash tools/ci/plugin-triage-oracle.sh --check \
            bash tools/ci/module-linkage-oracle.sh --check \
              cargo test --locked -p rampage-api -p rampage-cli --test integration -- plugin_triage:: --include-ignored
      - name: Owned DWARF reviewed import surfaces and worker acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DEBUG_LAYOUT_CPP: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/debug-layout-oracle.sh --check \
            cargo test --locked -p rampage-loaders -p rampage-api -p rampage-worker \
            -p rampage-cli -p rampage-mcp -p rampage-ui \
            --test integration -- debug_layouts:: debug_layout_import:: debug_layout_acceptance:: \
            debug_layout_review:: debug_layout_tools:: debug_layout:: --include-ignored
      - name: Owned bounded C++ record and this-method acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/debug-cpp-layout-oracle.sh --check \
            cargo test --locked -p rampage-loaders -p rampage-api -p rampage-worker \
            --test integration -- debug_cpp_layouts:: debug_cpp_layout_acceptance:: --include-ignored
      - name: Owned opaque-vptr and exact source-slot acceptance
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_HOST="$(rustc --version --verbose | sed -n 's/^host: //p')"
          bash tools/ci/debug-cpp-virtual-acceptance.sh
      - name: Opt-in native compiled fixture and isolated CLI acceptance
        timeout-minutes: 5
        run: |
          time cargo test --locked -p rampage-api --test integration -- compiled_arm64:: --ignored
          export RAMPAGE_TEST_CLI="$PWD/target/debug/rampage"
          test -x "$RAMPAGE_TEST_CLI"
          time cargo test --locked -p rampage-worker --test integration -- cli:: --ignored

  linux-core:
    name: Linux core subset (no UI or YARA/Wasmtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Require C/C++ fixture compilers
        timeout-minutes: 2
        run: |
          rustc --version --verbose
          cargo --version
          cc --version
          clang --version
          clang++ --version
          objcopy --version
      - name: Warnings-denied core Clippy and tests
        timeout-minutes: 20
        run: bash tools/ci/linux-core.sh

  linux-components:
    name: Linux component runtime (separate from the core subset)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Component runtime and schema regressions
        timeout-minutes: 20
        run: cargo test --locked -p rampage-plugin-contract -p rampage-plugin --lib
      - name: Owned import-free components and hostile resource probes
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash tools/ci/plugin-triage-oracle.sh --check \
            cargo test --locked -p rampage-plugin \
              --test integration -- component:: resource_controls:: cancellation:: --ignored

# Step/job timeouts bound CI execution, not individual analysis time or memory.
# macOS runs the ordinary debug workspace suite once, plus the selected compiled-fixture and isolated gates above.
# Linux additionally compiles x86-64 ELF layout constants/field-use oracles and runs the selected ignored layout gates.
# Ignored million-point context and Chrome performance tests are not CI coverage; Linux checks only the named core.
# Metal-backed UI snapshots must pass on macOS; no snapshot updates, skips, or headless Linux UI claims.
