[package]
name = "rampage-eval"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
autotests = false

[dependencies]
clap.workspace = true
gimli = { version = "=0.34.0", default-features = false, features = ["read", "std"] }
object = { workspace = true, features = ["build", "compression"] }
rampage-analysis.workspace = true
rampage-agent.workspace = true
rampage-mcp.workspace = true
rampage-api.workspace = true
rampage-arch.workspace = true
rampage-decompiler.workspace = true
rampage-detect.workspace = true
rampage-loaders.workspace = true
rampage-signatures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
assert_cmd.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
