member, and the member's byte offset as offset.
"""
truth_reference = """
The single load in sqlite3_total_changes64 (llvm-objdump), the parameter type and member offsets from the fixture's
DWARF (llvm-dwarfdump), and the amalgamation source's `return db->...;`; derive-truth.py.
"""
