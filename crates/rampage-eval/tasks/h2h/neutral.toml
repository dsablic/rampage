[tasks.helper-arithmetic-x64-elf]
question = """
For the exported function beginning at 0x1340, determine the integer result when its first argument is 7.
The address is the shared object's own link-time virtual address (image base 0); a tool that rebases the
image may show the function at that offset from its chosen base.
Return return_value as an integer; infer it from code without executing the binary.
"""
change = """
rampage loads a shared object at its link-time addresses; Ghidra rebases ET_DYN images (0x100000 on x86-64),
so the frozen bare address assumed rampage's convention.
"""

[tasks.helper-plt-result-x64-elf]
question = """
Follow the call from the exported function at 0x1350 through its linkage stub. The address is the shared
object's own link-time virtual address (image base 0); a tool that rebases the image may show the function at
that offset from its chosen base. Assuming the linked helper is not interposed, what integer does this
function return for first argument 7? Return return_value as an integer.
"""
change = """
rampage loads a shared object at its link-time addresses; Ghidra rebases ET_DYN images (0x100000 on x86-64),
so the frozen bare address assumed rampage's convention.
"""

