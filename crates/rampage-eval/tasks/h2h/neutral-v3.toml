engine; leave out the C++ runtime's own classes, which are declared in other namespaces. Return every direct
base-to-derived relationship as a [base, derived] pair of class names without the namespace, in an array named
edges.
"""
scoring = """
tuple_set: exactly the [base, derived] pairs, any order, no extras or duplicates; names compared exactly. Partial credit is the Jaccard index of the answered and expected sets (0 for a malformed answer, one with duplicates, or no answer). Lenient variant only (reported beside strict): the spellings below are read as the expected ones, ASCII case ignored.
"""
