[tasks.go-nested-field-x64-elf]
category = "go"
max_turns = 60
timeout_s = 7200
question = """
This is a large stripped Go executable for x86-64 Linux. The Go struct type
github.com/restic/restic/internal/restic.Snapshot has a field named Summary that points to another struct type.
Give that struct type's full name, with its package path, as type; its size in bytes as size; and, for its field
