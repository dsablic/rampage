version = 1
id = "scale-caller-count-x64-elf"
kind = "analysis"
question = """
This is a large stripped Go executable for x86-64 Linux. How many distinct functions contain at least one direct
call to github.com/gohugoio/hugo/common/paths.AbsPathify? Count each calling function once, including closures and
other compiler-generated functions; indirect calls do not count. Return the number as callers.
"""
truth_reference = """
Distinct functions with a direct CALL to github.com/gohugoio/hugo/common/paths.AbsPathify in `go tool objdump` of the unstripped twin; the function's address is never taken (no RIP-relative reference, no ·f closure symbol); go_graph.py and derive-truth.py.
"""
required_capabilities = ["go_metadata", "xrefs", "scale"]
capability_status = "unknown"
capability_evidence = "Not inventoried for suite v2; the agent runs measure it."

