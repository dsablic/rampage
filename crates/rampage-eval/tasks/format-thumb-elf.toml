kind = "analysis"
question = """
Identify the container, CPU family, bit width and byte order. Use fields format, arch, bits, endian;
normalize to ELF/PE/Mach-O, x86_64/aarch64/arm/mips, and little/big.
Report the CPU family, not its instruction mode.
"""
truth_reference = "tests/fixtures/build.sh:11; committed ELF header (file: ELF32 LSB ARM EABI5)."
