version = 1
id = "svd-status-readers-cm4-raw"
kind = "analysis"
question = """
The first file is a raw flash image for an ARM Cortex-M4 microcontroller (Thumb-2, little-endian), mapped at address
0x0 with no file header; it begins with the interrupt vector table. The second file is the microcontroller's
CMSIS-SVD device description. List the entry addresses of every function whose own code reads the register the
device description names UART0.STATUS. Return them in ascending order, without the Thumb bit, as an array of
integers named values.
"""
truth_reference = """
Host harness run of every function of src/periph.c with recorded register accesses (all are leaves); entry addresses
from the twin's symbols; derive-truth.py.
"""
required_capabilities = ["raw_loading", "xrefs", "peripheral_map"]
capability_status = "unknown"
capability_evidence = "Not inventoried for suite v4; the agent runs measure it."

[fixture]
id = "periph-cm4-bin"
path = "tests/fixtures/bench-v4/bin/periph-cm4.bin"
sha256 = "64f08bafa9b7cb939e8f0f08de06141e0b4d1fef746f61b65833bc4844cd47e0"
source = "tests/fixtures/bench-v4/src/periph.c"
build = "tests/fixtures/bench-v4/build.sh"

