[package]
name = "rampage-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
rampage-api.workspace = true
rampage-arch.workspace = true
rampage-loaders.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rampage-debug = { workspace = true, features = ["fake-stub"] }
rampage-decode.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["sync", "time"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
