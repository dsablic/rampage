[package]
name = "rampage-unpack"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
# Pure-Rust codecs only: no C library is built or linked (docs/plans/2026-11-15-firmware-unpacking.md).
backhand = { version = "0.25.5", default-features = false, features = ["error-strings"] }
ext4-view = { version = "1.0.0", features = ["std"] }
flate2 = "1.1.10"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
lz4_flex = { version = "0.11.6", default-features = false, features = ["std", "safe-decode"] }
ruzstd = "0.9.0"
lzo = "0.1.4"
bzip2-rs = "0.1.2"
sha2.workspace = true
serde.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true

[dev-dependencies]
# The test-side generator writes SquashFS with legacy LZMA, which Homebrew's mksquashfs cannot.
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "encoder"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
