[package]
name = "rampage-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "rampage-ui"
path = "src/main.rs"

[dependencies]
clap.workspace = true
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = "0.21.1"
egui_extras = "0.36.2"
rampage-agent.workspace = true
rampage-api.workspace = true
rampage-analysis.workspace = true
rampage-arch.workspace = true
rampage-loaders.workspace = true

[dev-dependencies]
serde_json.workspace = true
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
