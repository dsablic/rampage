[dependencies]
rampage-analysis.workspace = true
rampage-arch.workspace = true
rampage-loaders.workspace = true
rampage-decompiler.workspace = true
rampage-decode.workspace = true
rampage-signatures.workspace = true
rampage-capabilities.workspace = true
rampage-detect.workspace = true
rampage-yara.workspace = true
rampage-constants.workspace = true
rampage-debug.workspace = true
rampage-plugin.workspace = true
rampage-plugin-contract.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
md-5.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
rusqlite.workspace = true
regex = "1.13.1"
memchr = "2.8.3"
