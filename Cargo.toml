[workspace]
members = ["crates/*", "tools/armgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rampage-arch = { path = "crates/rampage-arch" }
rampage-loaders = { path = "crates/rampage-loaders" }
rampage-analysis = { path = "crates/rampage-analysis" }
rampage-agent = { path = "crates/rampage-agent" }
rampage-api = { path = "crates/rampage-api" }
rampage-mcp = { path = "crates/rampage-mcp" }
rampage-decompiler = { path = "crates/rampage-decompiler" }
rampage-decode = { path = "crates/rampage-decode" }
rampage-signatures = { path = "crates/rampage-signatures" }
rampage-capabilities = { path = "crates/rampage-capabilities" }
rampage-detect = { path = "crates/rampage-detect" }
rampage-yara = { path = "crates/rampage-yara" }
rampage-constants = { path = "crates/rampage-constants" }
rampage-debug = { path = "crates/rampage-debug" }
rampage-plugin = { path = "crates/rampage-plugin" }
rampage-plugin-contract = { path = "crates/rampage-plugin-contract" }
anyhow = "1.0.104"
assert_cmd = "2.2.2"
# Fallback decoders for architectures without a native, spec-generated one.
capstone = { version = "0.14.0", default-features = false, features = [
    "full",
    "std",
    "arch_m68k",
    "arch_mips",
    "arch_powerpc",
    "arch_riscv",
    "arch_sparc",
    "arch_sysz",
] }
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info", "encoder", "code_asm"] }
md-5 = "0.11.0"
memmap2 = "0.9.11"
predicates = "3.1.4"
rayon = "1.12.0"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.2"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

# Tests decompile constantly; an unoptimized embedded Ghidra decompiler dominates their runtime.
[profile.dev.package.rampage-decompiler]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
