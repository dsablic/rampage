[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rampage-arch = { path = "crates/rampage-arch" }
rampage-loaders = { path = "crates/rampage-loaders" }
rampage-analysis = { path = "crates/rampage-analysis" }
rampage-api = { path = "crates/rampage-api" }
rampage-mcp = { path = "crates/rampage-mcp" }
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
md-5 = "0.11.0"
memmap2 = "0.9.11"
predicates = "3.1.4"
rayon = "1.12.0"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.2"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std"] }

[profile.release]
lto = "thin"
codegen-units = 1
