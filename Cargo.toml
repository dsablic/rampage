[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rampage-arch = { path = "crates/rampage-arch" }
rampage-loaders = { path = "crates/rampage-loaders" }
rampage-analysis = { path = "crates/rampage-analysis" }
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
memmap2 = "0.9.11"
predicates = "3.1.4"
rayon = "1.12.0"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
